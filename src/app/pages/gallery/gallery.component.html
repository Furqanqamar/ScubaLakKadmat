<main class="page-surface">
  <section class="page-hero page-hero--gallery"><div class="page-hero__watermark">FIELD NOTES</div><div class="mx-auto max-w-[90rem]"><p class="eyebrow text-[#b8f2df]">A living archive</p><h1 class="mt-6 max-w-5xl font-serif text-6xl leading-[0.88] tracking-[-0.06em] text-white sm:text-8xl">The island<br><em>in frames.</em></h1><p class="mt-8 max-w-2xl text-base leading-8 text-white/60">Water, weather, reef light and the small pauses between dives. Open a frame for the story behind it.</p></div></section>
  <section class="bg-[#f4f1e9] px-5 py-20 sm:px-8 lg:px-10 lg:py-28" data-reveal><div class="mx-auto grid max-w-[90rem] grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">@for (item of items; track item.id) { <button [id]="item.id" class="gallery-card" [class.gallery-card--wide]="item.size === 'wide'" [class.gallery-card--tall]="item.size === 'tall'" type="button" (click)="open(item)" data-cursor="view" [attr.aria-label]="'Open ' + item.title"><img [appResponsiveImage]="item.imageUrl" [src]="item.imageUrl" [alt]="item.title" width="1200" height="800" loading="lazy" decoding="async"><span class="gallery-card__veil"></span><span class="gallery-card__copy"><small>{{ item.location }}</small><strong>{{ item.title }}</strong><em aria-hidden="true">↗</em></span></button> }</div></section>
</main>

@if (selectedItem(); as item) {
  <app-dialog-shell [labelledBy]="item.id + '-title'" (closed)="close()"><section class="gallery-lightbox__panel"><img [src]="item.imageUrl" [alt]="item.title"><div class="gallery-lightbox__caption"><div><p class="eyebrow text-[#b8f2df]">{{ item.location }}</p><h2 [id]="item.id + '-title'" class="mt-3 font-serif text-3xl text-white sm:text-4xl">{{ item.title }}</h2><p class="mt-3 max-w-xl text-sm leading-6 text-white/60">{{ item.description }}</p></div><button class="modal-close" type="button" (click)="close()" aria-label="Close image">×</button></div></section></app-dialog-shell>
}
