<main id="main-content" tabindex="-1" class="page-surface">
  <section data-page-hero class="page-hero page-hero--real">
    <img class="page-hero__photo" [appResponsiveImage]="cover.imageUrl" [src]="cover.imageUrl" sizes="100vw" [width]="cover.width" [height]="cover.height" alt="" loading="eager" fetchpriority="high" decoding="async">
    <div class="mx-auto max-w-[90rem]">
      <p class="eyebrow text-[#b8f2df]">{{ copy.eyebrow }}</p>
      <h1 class="mt-6 max-w-4xl font-serif text-6xl leading-[0.9] tracking-[-0.055em] text-white sm:text-8xl">{{ copy.title }}<br><em>{{ copy.emphasis }}</em></h1>
      <p class="mt-8 max-w-xl text-base leading-8 text-on-dark-secondary">{{ copy.introduction }}</p>
    </div>
  </section>
  <section class="bg-[#f4f1e9] px-5 py-20 sm:px-8 lg:px-10 lg:py-28">
    <div class="mx-auto max-w-[90rem]">
      <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">@for (service of services; track service.id) { <app-service-card [service]="service" /> }</div>
      <a class="button-link button-link--dark mt-10" routerLink="/kadmat" fragment="dive-spots">{{ copy.spotLink }}<span aria-hidden="true">↗</span></a>
    </div>
  </section>
  <app-media-story [items]="moments" [title]="mediaCopy.trainingTitle" [introduction]="mediaCopy.trainingIntro" />
</main>
