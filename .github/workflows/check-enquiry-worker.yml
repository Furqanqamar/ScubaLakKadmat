name: Check enquiry mail service (no deployment)

on:
  push:
    branches: [main, agent/scuba-lak-application]
    paths: [services/enquiry-worker/**, .github/workflows/check-enquiry-worker.yml]
  pull_request:
    paths: [services/enquiry-worker/**, .github/workflows/check-enquiry-worker.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/enquiry-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: services/enquiry-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'
