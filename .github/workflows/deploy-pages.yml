name: Deploy Scuba Lak to GitHub Pages

on:
  push:
    branches:
      - main
      - agent/scuba-lak-application
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build for the repository subpath
        run: |
          npm run build -- --base-href /ScubaLakKadmat/
          find dist/scuba-lak/browser -name '*.css' -print0 | xargs -0 sed -i 's#/media/#/ScubaLakKadmat/media/#g'
          cp dist/scuba-lak/browser/index.html dist/scuba-lak/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/scuba-lak/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
