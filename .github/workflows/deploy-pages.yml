name: Deploy QA-UAT to GitHub Pages

on:
  push:
    branches:
      - agent/scuba-lak-application
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/agent/scuba-lak-application'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix services/enquiry-worker ci --no-audit --no-fund

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build and verify the production release without deploying it
        run: |
          npm run build
          node scripts/verify-seo.mjs
          node scripts/verify-island-guides.mjs
          node scripts/verify-offerings.mjs
          node scripts/verify-kadmat-focus.mjs
          node scripts/verify-real-content.mjs
          node scripts/verify-brand-assets.mjs
          node scripts/verify-team-profiles.mjs
          node scripts/verify-hero-video.mjs
          node_modules/.bin/esbuild scripts/verify-page-transition.ts --bundle --platform=node --format=esm --packages=external --outfile=tmp/verify-page-transition.mjs
          node tmp/verify-page-transition.mjs
          node scripts/verify-initial-loader.mjs
          node_modules/.bin/esbuild scripts/verify-page-media-readiness.ts --bundle --platform=node --format=esm --packages=external --outfile=tmp/verify-page-media-readiness.mjs
          node tmp/verify-page-media-readiness.mjs
          node_modules/.bin/esbuild scripts/verify-media-swipe.ts --bundle --platform=node --format=esm --packages=external --outfile=tmp/verify-media-swipe.mjs
          node tmp/verify-media-swipe.mjs
          node_modules/.bin/esbuild scripts/verify-media-viewer-readiness.ts --bundle --platform=node --format=esm --packages=external --outfile=tmp/verify-media-viewer-readiness.mjs
          node tmp/verify-media-viewer-readiness.mjs
          node_modules/.bin/esbuild scripts/verify-reveal-motion.ts --bundle --platform=node --format=esm --packages=external --outfile=tmp/verify-reveal-motion.mjs
          node tmp/verify-reveal-motion.mjs
          node_modules/.bin/esbuild scripts/verify-cursor-motion.ts --bundle --platform=node --format=esm --packages=external --outfile=tmp/verify-cursor-motion.mjs
          node tmp/verify-cursor-motion.mjs
          node scripts/verify-card-interactions.mjs
          node scripts/verify-readability.mjs
          node scripts/verify-clean-heroes.mjs
          node_modules/.bin/esbuild scripts/verify-not-found-routes.ts --bundle --platform=node --format=esm --packages=external --outfile=tmp/verify-not-found-routes.mjs
          node tmp/verify-not-found-routes.mjs
          node scripts/verify-not-found.mjs
          node scripts/verify-site-status.mjs
          node_modules/.bin/esbuild scripts/verify-enquiry.ts --bundle --platform=node --format=esm --packages=external --outfile=tmp/verify-enquiry.mjs
          node tmp/verify-enquiry.mjs
          node scripts/verify-enquiry-contract.mjs
          npm --prefix services/enquiry-worker test
          node scripts/verify-environments.mjs

      - name: Identify the production-ready build from this QA commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          QA_RUN_ID: ${{ github.run_id }}
        run: node scripts/prepare-environment.mjs dist/scuba-lak/browser production "$SOURCE_COMMIT" "$QA_RUN_ID"

      - name: Save the exact production candidate (no Cloudflare deployment)
        uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: dist/scuba-lak/browser
          retention-days: 90

      - name: Build the complete GitHub QA site independently of production mode
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          QA_RUN_ID: ${{ github.run_id }}
        run: |
          npm run build -- --base-href /ScubaLakKadmat/
          node scripts/prepare-pages.mjs
          node scripts/verify-seo.mjs
          node scripts/verify-environments.mjs
          node scripts/prepare-environment.mjs dist/scuba-lak/browser qa "$SOURCE_COMMIT" "$QA_RUN_ID"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/scuba-lak/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record the tested version
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          QA_RUN_ID: ${{ github.run_id }}
        run: |
          echo "QA/UAT: https://furqanqamar.github.io/ScubaLakKadmat/" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $SOURCE_COMMIT; QA run: $QA_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Production is unchanged. Promote only after QA/UAT approval." >> "$GITHUB_STEP_SUMMARY"
