name: Switch website mode (no rebuild)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What should visitors see?
        type: choice
        required: true
        default: live
        options:
          - live
          - coming-soon
          - maintenance
  push:
    branches:
      - main
      - agent/scuba-lak-application
    paths:
      - public/site-status.json

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Choose mode and find the clean release
        id: release
        uses: actions/github-script@v7
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        with:
          script: |
            const fs = require('fs');
            if (context.eventName === 'push') {
              const before = context.payload.before;
              if (!before || /^0+$/.test(before)) { core.setOutput('skip', 'true'); return; }
              const comparison = await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `${before}...${context.sha}` });
              const changed = comparison.data.files || [];
              if (changed.length !== 1 || changed[0].filename !== 'public/site-status.json') {
                core.info('Code changed too; the normal release workflow will apply the configured mode.');
                core.setOutput('skip', 'true');
                return;
              }
            }
            core.setOutput('skip', 'false');
            const config = JSON.parse(fs.readFileSync('public/site-status.json', 'utf8'));
            const mode = process.env.REQUESTED_MODE || config.mode;
            if (!['live', 'coming-soon', 'maintenance'].includes(mode)) throw new Error('Invalid site mode.');
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const recent = await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, status: 'success', per_page: 100 });
            const active = recent.data.workflow_runs.find(run => /\/(deploy-pages|site-mode)\.yml$/.test(run.path));
            if (active && active.head_branch !== branch) throw new Error(`Choose the active website branch: ${active.head_branch}`);
            const builds = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'deploy-pages.yml', branch, status: 'success', per_page: 1 });
            const run = builds.data.workflow_runs[0];
            if (!run) throw new Error('Publish the full website once before using the fast switch.');
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: run.id });
            const artifact = artifacts.data.artifacts.find(item => item.name === 'site-release' && !item.expired);
            if (!artifact) throw new Error('The clean release is missing or expired. Run the normal deployment once to refresh it.');
            core.setOutput('mode', mode);
            core.setOutput('run_id', String(run.id));

      - name: Download the existing release (no install or Angular build)
        if: steps.release.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-release
          path: release
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the selected page to all website routes
        if: steps.release.outputs.skip != 'true'
        env:
          SITE_MODE: ${{ steps.release.outputs.mode }}
        run: node scripts/apply-site-mode.mjs --directory release --config public/site-status.json --mode "$SITE_MODE" --persist-config

      - uses: actions/configure-pages@v5
        if: steps.release.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.skip != 'true'
        with:
          path: release

      - name: Publish the mode change
        if: steps.release.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Keep the selected mode for future normal deployments
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.skip != 'true'
        env:
          SITE_MODE: ${{ steps.release.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/site-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Set website mode to $SITE_MODE"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Record the result
        if: steps.release.outputs.skip != 'true'
        env:
          SITE_MODE: ${{ steps.release.outputs.mode }}
        run: echo "Website mode is $SITE_MODE. Reused release ${{ steps.release.outputs.run_id }}; no application rebuild." >> "$GITHUB_STEP_SUMMARY"
